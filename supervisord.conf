[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
loglevel=info
user=root

[program:fastapi]
command=python3 -m uvicorn server:app --host %(ENV_API_HOST)s --port %(ENV_API_PORT)s --log-level info
directory=/app/api
autostart=true
autorestart=true
startretries=3
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=100
startsecs=10
stopwaitsecs=30
killasgroup=true
stopasgroup=true
